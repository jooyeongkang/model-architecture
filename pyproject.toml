[project]
name = "model-architecture"
version = "0.1.0"
description = "A framework-neutral baseline for data-driven model applications."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
model-architecture-example = "model_architecture.entrypoints.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_architecture"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["model_architecture"]
omit = ["src/model_architecture/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
